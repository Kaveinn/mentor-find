<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menjadi Pemateri — MentorFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card auth-card-wide">
    <div class="auth-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">M</span><span>Mentor<span class="brand-accent">Find</span></span>
      </a>
      <h2>Bergabung sebagai Pemateri</h2>
      <p class="muted">Tampilkan keahlian, pengalaman, dan bantu berbagai instansi menemukan Anda.</p>
    </div>

    <form onsubmit="handleAuthSubmit(event, 'mentor')">
      <div class="form-group">
        <label>Nama Lengkap & Gelar</label>
        <input class="input" placeholder="Contoh: Budi Prasetyo, M.Kom." required>
      </div>

      <div class="form-group">
        <label>Email Profesional</label>
        <input class="input" type="email" placeholder="budi@example.com" required>
      </div>

      <div class="form-group">
        <label>Bidang Keahlian Pokok</label>
        <input class="input" placeholder="Contoh: Artificial Intelligence, IoT, UI/UX Design" required>
      </div>

      <div class="form-group">
        <label>Kota Domisili</label>
        <input class="input" placeholder="Contoh: Malang" required>
      </div>

      <div class="form-group">
        <label>Pengalaman Mengajar / Public Speaking (Tahun)</label>
        <input class="input" type="number" min="0" placeholder="Contoh: 4" required>
      </div>

      <div class="form-group">
        <label>Tautan Portofolio / LinkedIn</label>
        <input class="input" type="url" placeholder="https://linkedin.com/in/username">
      </div>

      <button type="submit" class="btn btn-primary full">Ajukan Profil Pemateri</button>
    </form>

    <p class="modal-switch">
      <a href="index.html">← Kembali ke Beranda</a>
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
