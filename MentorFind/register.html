<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — MentorFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="close-btn">✕</a>
    
    <div class="auth-header">
      <h2>Sign Up</h2>
      <p>Buat akun baru untuk terhubung dengan pemateri</p>
    </div>

    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regName">Nama Lengkap</label>
        <input id="regName" type="text" placeholder="Masukkan nama lengkap" required>
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" placeholder="nama@email.com" required>
      </div>

      <div class="form-group">
        <label for="regRole">Tipe Akun</label>
        <select id="regRole">
          <option value="Pencari Pemateri">Pencari Pemateri</option>
          <option value="Pemateri">Pemateri</option>
        </select>
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input id="regPassword" type="password" placeholder="Minimal 8 karakter" required>
      </div>

      <button type="submit" class="btn-auth">Buat Akun</button>
    </form>

    <div id="registerAlert"></div>

    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Masuk</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
