<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — BICARA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="close-btn">✕</a>
    
    <div class="auth-header">
      <h2>Sign Up</h2>
      <p>Buat akun baru untuk terhubung dengan pemateri</p>
    </div>

<form id="registerForm" onsubmit="handleRegister(event)">
    <!-- Input Nama -->
    <input type="text" id="registerName" name="name" placeholder="Nama Lengkap" required>
    
    <!-- Input Email -->
    <input type="email" id="registerEmail" name="email" placeholder="Email" required>
    
    <!-- Select Tipe Akun -->
    <select id="registerRole" name="role" required>
        <option value="">-- Pilih Tipe Akun --</option>
        <option value="user">Pengguna</option>
        <option value="pemateri">Pemateri</option>
    </select>
    
    <!-- Input Password -->
    <input type="password" id="registerPassword" name="password" placeholder="Password" required>
    
    <button type="submit">Buat Akun</button>
</form>

    <div id="registerAlert"></div>

    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Masuk</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
