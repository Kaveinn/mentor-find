<!-- KUNCI UTAMA: class="auth-page" -->
<body class="auth-page">

    <div class="auth-card">
        <!-- Tombol Close -->
        <a href="index.html" class="close-btn" title="Tutup">✕</a>

        <div class="auth-header">
            <a class="brand" href="index.html">
                <span class="brand-mark">B</span>
                <span>BICARA</span>
            </a>
            <h2>Sign Up</h2>
            <p>Buat akun baru untuk terhubung dengan pemateri</p>
        </div>

        <form onsubmit="handleRegister(event)" id="registerForm">
            <div class="form-group">
                <label for="registerName">Nama Lengkap</label>
                <input type="text" id="registerName" name="name" placeholder="Nama Lengkap" required>
            </div>

            <div class="form-group">
                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" name="email" placeholder="Email" required>
            </div>

            <div class="form-group">
                <label for="registerRole">Tipe Akun</label>
                <select id="registerRole" name="role" required>
                    <option value="">-- Pilih Tipe Akun --</option>
                    <option value="user">Pengguna</option>
                    <option value="pemateri">Pemateri</option>
                </select>
            </div>

            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" name="password" placeholder="Minimal 6 karakter" required>
            </div>

            <button type="submit" class="btn-auth">Buat Akun</button>

            <div class="auth-footer">
                Sudah punya akun? <a href="login.html">Masuk</a>
            </div>
        </form>
    </div>
