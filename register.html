<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — MentorFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="close-btn">✕</a>
    
    <div class="auth-header">
      <h2>Sign Up</h2>
      <p>Buat akun baru untuk terhubung dengan pemateri</p>
    </div>

<form onsubmit="handleRegister(event)">
    <div class="form-group">
        <label for="registerName">Nama Lengkap</label>
        <input type="text" id="registerName" name="name" required placeholder="Nama Lengkap">
    </div>

    <div class="form-group">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" name="email" required placeholder="Email">
    </div>

    <div class="form-group">
        <label for="registerRole">Tipe Akun</label>
        <select id="registerRole" name="role" required>
            <option value="user">Pengguna (Cari Pemateri)</option>
            <option value="mentor">Pemateri</option>
        </select>
    </div>

    <div class="form-group">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" name="password" required placeholder="Password">
    </div>

    <button type="submit" class="btn btn-primary">Buat Akun</button>
</form>


    <div id="registerAlert"></div>

    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Masuk</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
