<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — BICARA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="close-btn">✕</a>
    
    <div class="auth-header">
      <h2>Log In</h2>
      <p>Masuk ke akun BICARA Anda</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="Write your email" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-auth">Log In</button>
    </form>

    <div id="loginAlert"></div>

    <div class="auth-footer">
      Belum punya akun? <a href="register.html">Daftar sekarang</a>
    </div>
  </div>
